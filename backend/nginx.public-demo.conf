limit_req_zone $binary_remote_addr zone=demo_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=demo_previews:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=demo_clients:10m;
limit_conn_zone $server_name zone=demo_total:1m;
log_format demo '$time_iso8601 method=$request_method status=$status rt=$request_time limit=$limit_req_status';

server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/demo-cert.pem;
    ssl_certificate_key /etc/nginx/demo-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    access_log /dev/stdout demo;
    # NGINX error messages can include request targets and client addresses.
    error_log /dev/stderr crit;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn demo_clients 12;
    limit_conn demo_total 96;
    limit_req zone=demo_requests burst=30 nodelay;
    client_max_body_size 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_set_header X-Workspace-Key "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # Resolve the service again after API container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $demo_upstream http://demo-api:8000;

    location = /demo/forecasts/preview {
        limit_req zone=demo_requests burst=30 nodelay;
        limit_req zone=demo_previews burst=6 nodelay;
        proxy_pass $demo_upstream;
    }
    location ~ ^/(app-mode|health|demo/portfolio)$ { proxy_pass $demo_upstream; }
    location = / { proxy_pass $demo_upstream; }
    location /assets/ { proxy_pass $demo_upstream; }
    location / { return 404; }
}
