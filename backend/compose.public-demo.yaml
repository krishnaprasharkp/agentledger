# Standalone file. Do not merge with compose.yaml.
services:
  demo-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers", "--no-access-log", "--limit-concurrency", "128", "--timeout-keep-alive", "5"]
    environment:
      APP_MODE: public_demo
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      EXTRACTION_PROVIDER: rules
      SUPPORT_LIVE_PROBE_ENABLED: "false"
      LLM_API_KEY: ""
      WORKSPACE_API_KEY: ""
    networks: [demo-backend]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
  proxy:
    image: nginx:stable-alpine
    depends_on:
      demo-api:
        condition: service_healthy
    ports:
      - "${DEMO_BIND_ADDRESS:-127.0.0.1}:${DEMO_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx.public-demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DEMO_TLS_CERT:?Set DEMO_TLS_CERT}:/etc/nginx/demo-cert.pem:ro
      - ${DEMO_TLS_KEY:?Set DEMO_TLS_KEY}:/etc/nginx/demo-key.pem:ro
    networks: [demo-edge, demo-backend]
    restart: unless-stopped

networks:
  demo-edge:
  demo-backend:
    internal: true
